[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-ids"
version = "1.0.0"
description = "AI-Based Intrusion Detection System — NSL-KDD, Random Forest, XGBoost, Neural Network"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "eeshsaxena"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false

[tool.ruff]
line-length = 100
target-version = "py311"
