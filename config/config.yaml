data:
  nsl_kdd_train_url: "https://raw.githubusercontent.com/jmnwong/NSL-KDD-Dataset/master/KDDTrain+.txt"
  nsl_kdd_test_url: "https://raw.githubusercontent.com/jmnwong/NSL-KDD-Dataset/master/KDDTest+.txt"
  train_path: "data/raw/KDDTrain+.txt"
  test_path: "data/raw/KDDTest+.txt"
  processed_train: "data/processed/train.pkl"
  processed_test: "data/processed/test.pkl"

models:
  random_forest:
    n_estimators: 200
    max_depth: 20
    min_samples_split: 5
    min_samples_leaf: 2
    random_state: 42
    n_jobs: -1
    class_weight: "balanced"

  xgboost:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1
    use_label_encoder: false
    eval_metric: "mlogloss"

  neural_network:
    hidden_layers: [256, 128, 64, 32]
    dropout_rate: 0.3
    learning_rate: 0.001
    batch_size: 512
    epochs: 100
    early_stopping_patience: 10
    weight_decay: 1e-4
    validation_split: 0.1

  ensemble:
    weights: [1.0, 1.0, 1.0]  # RF, XGBoost, Neural Network
    voting: "soft"

training:
  test_size: 0.2
  random_state: 42
  cv_folds: 5

output:
  models_dir: "models/saved"
  results_dir: "results"
  plots_dir: "results/plots"
